name: Build Linux/Windows Release (glibc 2.28 + UPX)

on:
  push:
    tags:
      - 'hx-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        run: pip3 install ziglang

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      # x86_64：构建后立即打包（此时 runtime/grammars/*.so 为 x86_64）
      - name: Build and package x86_64
        run: |
          set -euxo pipefail
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28 -p helix-term
          d=dist/helix-x86_64-glibc228-upx
          mkdir -p "$d"
          cp target/x86_64-unknown-linux-gnu/release/hx "$d/"
          cp -a runtime "$d/runtime"
          cp README.md LICENSE "$d/"
          rm -rf "$d/runtime/grammars/sources"
          find "$d/runtime/grammars" -maxdepth 1 -name '*.so' -exec strip {} + || true
          upx --best --lzma "$d/hx"
          tar czf dist/helix-x86_64-linux-glibc228-upx.tar.gz -C "$d" .

      # aarch64：删除 x86_64 的 .so，强制 build.rs 按目标重编 grammar
      - name: Build and package aarch64
        run: |
          set -euxo pipefail
          rm -f runtime/grammars/*.so
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28 -p helix-term
          d=dist/helix-aarch64-glibc228-upx
          mkdir -p "$d"
          cp target/aarch64-unknown-linux-gnu/release/hx "$d/"
          cp -a runtime "$d/runtime"
          cp README.md LICENSE "$d/"
          rm -rf "$d/runtime/grammars/sources"
          find "$d/runtime/grammars" -maxdepth 1 -name '*.so' -exec strip {} + || true
          upx --best --lzma "$d/hx"
          tar czf dist/helix-aarch64-linux-glibc228-upx.tar.gz -C "$d" .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install UPX
        run: choco install upx -y --no-progress

      # grammar 源码里含 Linux 符号链接，Windows 下禁用符号链接检出，避免悬空链接
      - name: Disable git symlinks
        run: git config --global core.symlinks false

      - name: Build x86_64 (MSVC)
        run: cargo build --release --target x86_64-pc-windows-msvc -p helix-term

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $d = "dist/helix-x86_64-windows-upx"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          # grammar 源码不打包（含悬空符号链接），复制前先删除
          if (Test-Path "runtime/grammars/sources") { Remove-Item -Recurse -Force "runtime/grammars/sources" }
          Copy-Item target/x86_64-pc-windows-msvc/release/hx.exe $d/
          Copy-Item -Recurse runtime "$d/runtime"
          Copy-Item README.md, LICENSE $d/
          # grammar dll 用 llvm-strip 去符号（失败则跳过），hx.exe 用 UPX 压缩
          $strip = "C:\Program Files\LLVM\bin\llvm-strip.exe"
          if (Test-Path $strip) {
            Get-ChildItem "$d/runtime/grammars/*.dll" | ForEach-Object { & $strip $_.FullName 2>$null }
          }
          upx --best --lzma "$d/hx.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          tar -a -cf dist/helix-x86_64-windows-upx.zip -C $d .
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum helix-x86_64-linux-glibc228-upx.tar.gz helix-aarch64-linux-glibc228-upx.tar.gz helix-x86_64-windows-upx.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Helix (glibc 2.28 / Windows, UPX) ${{ github.ref_name }}"
          files: |
            dist/helix-x86_64-linux-glibc228-upx.tar.gz
            dist/helix-aarch64-linux-glibc228-upx.tar.gz
            dist/helix-x86_64-windows-upx.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
